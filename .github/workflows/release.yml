name: Release installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing vX.Y.Z tag to publish
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select and validate version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(<VERSION)" == "$version" ]]
          git rev-parse --verify "refs/tags/$version"
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Package installer
        run: |
          mkdir dist
          git archive --format=tar --prefix=mcbe-gdk-installer/ "$VERSION" |
            gzip -n -9 >"dist/mcbe-gdk-installer-$VERSION.tar.gz"
          (
            cd dist
            sha256sum "mcbe-gdk-installer-$VERSION.tar.gz" \
              >"mcbe-gdk-installer-$VERSION.tar.gz.sha256"
          )

      - name: Attest installer archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/mcbe-gdk-installer-${{ env.VERSION }}.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              "dist/mcbe-gdk-installer-$VERSION.tar.gz" \
              "dist/mcbe-gdk-installer-$VERSION.tar.gz.sha256" \
              --clobber
          else
            gh release create "$VERSION" \
              "dist/mcbe-gdk-installer-$VERSION.tar.gz" \
              "dist/mcbe-gdk-installer-$VERSION.tar.gz.sha256" \
              --verify-tag \
              --generate-notes \
              --title "MCBE GDK Installer $VERSION"
          fi
